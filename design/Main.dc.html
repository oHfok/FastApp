<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #0A0B10; color: #F3F1EA;
           font-family: 'Space Grotesk', system-ui, sans-serif; }
    a { color: #E8A33D; } a:hover { color: #F0B155; }
  </style>
</helmet>

<div style="width: 760px; height: 520px; box-sizing: border-box; background: #0A0B10; border-radius: 20px; padding: 22px 24px 0 24px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

  <!-- Chrome: identity left, live state right. No title bar, no tabs. -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="width: 10px; height: 10px; border-radius: 50%; background: #E8A33D; flex-shrink: 0;"></span>
    <span style="font-size: 14px; font-weight: 700; letter-spacing: -0.01em;">FastApp</span>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #34D3C4; flex-shrink: 0;"></span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.17em; color: #7C8194; font-weight: 700;">TRACKING</span>
    </div>
    <div style="width: 1px; height: 14px; background: rgba(255,255,255,0.08);"></div>
    <div style="display: flex; align-items: baseline; gap: 7px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.17em; color: #7C8194; font-weight: 700;">FOCUS</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: #E8A33D;">4h 12m</span>
    </div>
  </div>

  <!-- The one input. Oversized on purpose: it is the whole interface. -->
  <div style="display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 0 24px; height: 60px; flex-shrink: 0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C8194" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
    </svg>
    <span style="font-size: 20px; color: #7C8194; letter-spacing: -0.01em;">Search apps, actions and commands</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C8194; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 5px 11px;">Ctrl ⇧ Space</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-height: 0;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.17em; color: #7C8194; font-weight: 700;">RECENT</span>

    <div style="display: flex; flex-direction: column; gap: 3px;">

      <!-- Focused row. Brass appears here and nowhere else on the screen. -->
      <div style="display: flex; align-items: center; gap: 14px; background: rgba(232,163,61,0.09); border-radius: 100px; padding: 11px 16px;">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: rgba(139,124,255,0.18); color: #F3F1EA; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">V</span>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 700; color: #E8A33D;">Valorant</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C8194;">Gaming</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9C9FAE; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 5px 11px;">V + A + L</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #E8A33D; width: 62px; text-align: right;">2h 06m</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; border-radius: 100px; padding: 11px 16px;">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: rgba(52,211,196,0.18); color: #F3F1EA; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">Z</span>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 500;">Zen</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C8194;">Browsing</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C8194; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 5px 11px;">Auto-start</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9C9FAE; width: 62px; text-align: right;">1h 48m</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; border-radius: 100px; padding: 11px 16px;">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: rgba(29,118,109,0.28); color: #F3F1EA; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">D</span>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 500;">Discord</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C8194;">Communication</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9C9FAE; width: 62px; text-align: right;">52m</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; border-radius: 100px; padding: 11px 16px;">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: rgba(139,124,255,0.18); color: #F3F1EA; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">S</span>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 500;">Steam</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7C8194;">Gaming</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9C9FAE; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 5px 11px;">⇧ + S + T</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9C9FAE; width: 62px; text-align: right;">14m</span>
      </div>

    </div>
  </div>

  <!-- Keyboard contract, always visible. This is a keyboard-first surface. -->
  <div style="display: flex; align-items: center; gap: 20px; padding: 14px 4px 16px 4px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F3F1EA; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 4px 9px;">↑↓</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.17em; color: #7C8194; font-weight: 700;">MOVE</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F3F1EA; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 4px 9px;">↵</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.17em; color: #7C8194; font-weight: 700;">LAUNCH</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F3F1EA; background: rgba(255,255,255,0.035); border-radius: 100px; padding: 4px 9px;">⇥</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.17em; color: #7C8194; font-weight: 700;">EDIT</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.17em; color: #7C8194; font-weight: 700;">8 APPS · 4 HOTKEYS</span>
  </div>

</div>
</x-dc>
</body>
</html>
