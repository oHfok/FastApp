<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastApp Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="overflow-hidden transition-colors duration-300">

    <div class="rainforest-scene" aria-hidden="true">
        <div class="forest-photo"></div>
        <canvas id="rain-canvas"></canvas>
    </div>

    <!-- MASTER WRAPPER: This absolutely forces the side-by-side layout -->
    <div class="flex flex-row h-screen w-full">

        <!-- LEFT SIDE: Sidebar -->
        <aside class="w-64 glass-panel flex flex-col z-20 shadow-2xl flex-shrink-0 h-full border-r border-slate-700/30">
            <div class="p-6 mb-2">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 drop-shadow-md">FastApp</h1>
            </div>
            <div class="px-6 mb-6">
                <label class="text-[10px] opacity-70 font-bold uppercase tracking-widest mb-2 block">Time Machine</label>
                <input type="date" id="global-date" class="w-full glass-input rounded-xl px-4 py-2.5 text-sm font-medium" onchange="refreshCurrentTab()">
            </div>
            <!-- Nav Container -->
            <nav id="tab-nav" class="flex-1 flex flex-col gap-2 px-4 mt-2 overflow-y-auto pb-4"></nav>
        </aside>

        <!-- RIGHT SIDE: Main Content -->
        <main class="flex-1 min-w-0 h-full overflow-y-auto p-8 relative z-10">
            <!-- The Javascript injects all the partials here -->
            <div id="tab-sections"></div>
            <!-- The Drilldown panel lives here -->
            <div id="drilldown-container"></div>
        </main>

    </div>

    <!-- Script loading order (Do not change) -->
    <script src="js/utils.js"></script>
    <script src="js/tabs/overview.js"></script>
    <script src="js/tabs/leaderboard.js"></script>
    <script src="js/tabs/insights.js"></script>
    <script src="js/tabs/timeline.js"></script>
    <script src="js/tabs/allapps.js"></script>
    <script src="js/tabs/settings.js"></script>
    <script src="js/drilldown.js"></script>
    <script src="js/app.js"></script>
    <script src="js/rain-effect.js"></script>
</body>
</html>
