<div class="flex items-center justify-between mb-8">
    <div>
        <h2 class="text-3xl font-bold text-white mb-1">Daily Timeline</h2>
        <p class="text-slate-400 text-sm">Visual breakdown of your application sessions (24-Hour Format).</p>
    </div>
</div>

<div class="glass-card mb-8 overflow-hidden p-0 relative">
    <!-- Time Axis Header -->
    <div class="flex border-b border-slate-700/50 bg-slate-900/40 text-[10px] font-bold text-slate-500 uppercase tracking-widest pl-36 relative">
        <div class="w-full flex justify-between px-1 py-3">
            <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
        </div>
    </div>

    <!-- Gantt Chart Container -->
    <div id="timeline-container" class="relative min-h-[300px] w-full pb-6 pt-2">
        <!-- Vertical Grid Lines (Background) -->
        <div class="absolute top-0 bottom-0 left-36 right-0 pointer-events-none z-0">
            <!-- 06:00 Line -->
            <div class="absolute left-[25%] top-0 bottom-0 border-l border-slate-600/40 border-dashed"></div>
            <!-- 12:00 Line -->
            <div class="absolute left-[50%] top-0 bottom-0 border-l border-slate-600/40 border-dashed"></div>
            <!-- 18:00 Line -->
            <div class="absolute left-[75%] top-0 bottom-0 border-l border-slate-600/40 border-dashed"></div>
        </div>

        <!-- Rows injected via JS -->
        <div id="timeline-rows" class="relative z-10 w-full flex flex-col gap-2"></div>
    </div>
</div>
