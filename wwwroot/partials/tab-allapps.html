<div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
    <div>
        <h2 class="text-3xl font-bold text-white mb-1">All Applications</h2>
        <p class="text-slate-400 text-sm">Lifetime master list of every tracked executable.</p>
    </div>
    <div class="flex flex-wrap gap-4">
        <input type="text" id="allapps-search" onkeyup="handleAllAppsSearch()" placeholder="🔍 Search library..." class="glass-input rounded-xl px-4 py-2.5 w-64 text-sm">
    </div>
</div>

<div class="glass-card !p-0 overflow-hidden border-t-4 border-t-slate-600/50">
    <div class="overflow-x-auto w-full">
        <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
                <tr class="bg-slate-900/60 text-slate-400 text-[10px] uppercase tracking-widest border-b border-slate-700/50">
                    <th class="py-4 px-6 font-bold sortable hover:text-blue-400 cursor-pointer transition-colors" onclick="sortAllApps('appName')">Application ↕</th>
                    <th class="py-4 px-6 font-bold sortable hover:text-blue-400 cursor-pointer transition-colors" onclick="sortAllApps('category')">Category ↕</th>
                    <th class="py-4 px-6 text-right font-bold sortable hover:text-blue-400 cursor-pointer transition-colors" onclick="sortAllApps('totalFocus')">
                        <span class="border-b border-dashed border-slate-500" title="Time actively interacting with the application.">Focus Time ↕</span>
                    </th>
                    <th class="py-4 px-6 text-right font-bold sortable hover:text-blue-400 cursor-pointer transition-colors" onclick="sortAllApps('totalRuntime')">
                        <span class="border-b border-dashed border-slate-500" title="Total time the application was open (background or foreground).">Running Time ↕</span>
                    </th>
                    <th class="py-4 px-6 text-right font-bold sortable hover:text-blue-400 cursor-pointer transition-colors" onclick="sortAllApps('totalAfk')">
                        <span class="border-b border-dashed border-slate-500" title="Time accrued while you were away from the keyboard.">AFK ↕</span>
                    </th>
                    <th class="py-4 px-6 text-right font-bold sortable hover:text-blue-400 cursor-pointer transition-colors" onclick="sortAllApps('longestSession')">
                        <span class="border-b border-dashed border-slate-500" title="The single longest continuous session recorded for this app.">Top Session ↕</span>
                    </th>
                </tr>
            </thead>
            <tbody id="allapps-body" class="divide-y divide-slate-700/30">
                <!-- Rows injected via JS -->
            </tbody>
        </table>
    </div>
</div>
